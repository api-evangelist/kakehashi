name: Kakehashi
description: Kakehashi is a Japanese healthcare technology company digitally transforming
  the country's roughly 60,000 community pharmacies, a traditionally paper-based sector.
  Its flagship cloud platform Musubi provides electronic medication history, automated
  dispensing records, and personalized patient guidance, and is used by more than
  14,000 pharmacies across Japan. The product suite extends to Musubi Insight (pharmacy
  management analytics), Pocket Musubi (patient follow-up app), Musubi AI Stock Management
  (machine-learning demand forecasting and inventory optimization), and Pharmarket.
  Kakehashi is backed by investors including 500 Global and Goldman Sachs. No public
  developer API or platform is currently published.
